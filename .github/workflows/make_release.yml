name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: "recursive"

      - name: "Install zipmerge"
        run: |
          sudo apt-get install -y zipmerge

      - name: "Install atool"
        run: |
          sudo apt-get install -y atool

      - name: "Create zip"
        run: |
          ./scripts/package.sh --target github

      - name: "Create release"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: "Media Converter ${{github.ref_name}}"
          files: |
            *.ankiaddon

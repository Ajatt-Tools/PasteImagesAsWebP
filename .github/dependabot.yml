# Adapted from https://github.com/Ajatt-Tools/mergenotes/blob/154e9e2c18ea3b940d95fd3ea56b25d3e20f64fe/.github/dependabot.yml
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - "area/dependencies"
    groups:
      # group minor/patch updates together
      # Major updates are intentionally left ungrouped for individual review
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # PyPi
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - "area/dependencies"
    groups:
      # group minor/patch updates together
      # Major updates are intentionally left ungrouped for individual review
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Git submodules (media_converter/ajt_common)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "area/dependencies"

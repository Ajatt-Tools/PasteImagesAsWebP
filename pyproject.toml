[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.24",
    "hatch-vcs>=0.4",
]

[project]
name = "media-converter"
dynamic = ["version"]
description = "An Anki add-on that makes your images small."
readme = "README.md"
requires-python = "~=3.10" # anki officially only runs on 3.10
license = { file = "LICENSE" }
keywords = ["ajatt"]
authors = [
    { name = "Ajatt-Tools and contributors" },
    { name = "Ren Tatsumoto", email = "tatsu@autistici.org" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Ajatt-Tools/PasteImagesAsWebP"
Issues = "https://github.com/Ajatt-Tools/PasteImagesAsWebP/issues"
Source = "https://github.com/Ajatt-Tools/PasteImagesAsWebP"

# Tools

[tool.hatch.version]
source = "vcs"
path = "media_converter/__about__.py"

[tool.hatch.build.hooks.vcs]
version-file = "media_converter/__about__.py"

[tool.hatch.envs.dev]
dependencies = [
    "mypy>=1.0.0",
    "isort",
    "pytest",
    "aqt>=26.5",
    "pyupgrade",
    "beartype",
]
python = "3.10"
system-packages = true

[[tool.hatch.envs.dev.matrix]]
# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
python = ["3.10", ]

[tool.hatch.envs.dev.scripts]
# run as `hatch run dev:scriptname`
check = "mypy --install-types --non-interactive {args:media_converter tests}"
format = "$(git rev-parse --show-toplevel)/scripts/format.sh"
package = "$(git rev-parse --show-toplevel)/scripts/package.sh"

[tool.coverage.run]
source_pkgs = ["media_converter", "tests"]
branch = true
parallel = true
omit = [
    "media_converter/__about__.py",
]

[tool.coverage.paths]
media_converter = ["media_converter", "*/media_converter/media_converter"]
tests = ["tests", "*/media_converter/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 120
target-version = ['py310']
unstable = true

[tool.isort]
profile = "black"

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
# Only collect tests from the tests/ directory, not from source files.
testpaths = ["tests"]

# https://hatch.pypa.io/latest/config/internal/testing/
# https://hatch.pypa.io/latest/tutorials/testing/overview/
[tool.hatch.envs.hatch-test]
dependencies = [
    "mypy>=1.0.0",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "aqt>=26.5", # needed to run Anki addon tests
    "beartype",
]
system-packages = true
parallel = true
randomize = true

# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
# NOTE: Anki is still stuck on python 3.10. Ensure the add-on works on Python 3.10.
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", ]

[tool.hatch.envs.hatch-static-analysis]
# https://hatch.pypa.io/latest/how-to/static-analysis/behavior/
dependencies = [
    "black",
    "flake8",
    "isort",
    "pyupgrade",
]

[tool.hatch.envs.hatch-static-analysis.scripts]
format-check = [
    "black --check --diff {args:.}",
    "isort --check-only --diff {args:.}",
]
format-fix = [
    # run as: hatch fmt -f
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" ",
]
lint-check = "flake8 --max-line-length 120 {args:.}"
lint-fix = "lint-check"
